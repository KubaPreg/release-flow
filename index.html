    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256));
  }
  var saved = null; try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) open(bytes(saved)).catch(function () { try { localStorage.removeItem(STORE); } catch (e) {} });
  document.getElementById('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('b'), err = document.getElementById('e');
    btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';

      var raw = await derive(document.getElementById('p').value);

    } catch (e) {

    }
  });
})();
